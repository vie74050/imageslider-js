<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageSlidersJS</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header>
  <h1>ImageSlidersJS</h1>
  <span id="dsName" class="dsname">No folder loaded</span>
  <select id="sampleSel" title="Samples on the server (imagesets/CT, imagesets/MRI)" hidden></select>
  <span class="sp"></span>
  <label class="chk"><input type="checkbox" id="showMap"> Reference map</label>
  <label class="chk"><input type="checkbox" id="showAll"> All labels</label>
  <button id="btnFolder" title="Choose a folder that contains data.js and an images/ folder">Open folder…</button>
  <input type="file" id="folderIn" webkitdirectory hidden>
</header>

<main>
  <div id="stage">
    <div id="empty">
      <div class="big">No folder loaded</div>
      <p>Choose a sample from the menu above, or open a folder that contains a <code>data.js</code> and an <code>images/</code> folder.</p>
      <button id="btnFolder2">Open folder…</button>
    </div>

    <div id="sizer">
      <div id="scene">
        <img id="img" alt="MRI slice" draggable="false">
        <div id="msg"></div>
        <div id="pts"></div>
      </div>
    </div>
    <div id="hud"></div>

    <div id="map" hidden>
      <div id="mapwrap">
        <img id="mapImg" alt="Reference map" draggable="false">
        <div class="blk" id="blk1"></div>
        <div class="blk" id="blk2"></div>
        <div id="band"></div>
        <div id="cursor"></div>
      </div>
      <div id="mapLabel"></div>
    </div>
    <div id="toast"></div>
  </div>

  <!-- Slider controls. Moved between this rail (vertical, the default) and the footer
       (horizontal) according to isVerticalPath in data.js. -->
  <div id="rail">
    <div id="ctl" class="vertical">
      <button id="play" title="Play / pause (Space)">▶</button>
      <button id="prev" title="Previous frame">▲</button>
      <input type="range" id="slider" min="0" max="0" value="0" step="1">
      <button id="next" title="Next frame">▼</button>
      <input type="number" id="frameNum" min="0" step="1" title="Go to frame">
    </div>
  </div>

  <aside>
    <section id="info"></section>
    <section><h2>Groups</h2><div id="groups"></div></section>
    <details>
      <summary>Calibration</summary>
      <div class="body">
        <span class="full hint">Point alignment (data coordinates → image pixels). Saved per folder name.</span>
        <label>Offset X</label><input type="number" id="offX" step="1">
        <label>Offset Y</label><input type="number" id="offY" step="1">
        <label>Scale</label><input type="number" id="scl" step="0.01">
        <label>Marker px</label><input type="number" id="msz" step="1" min="4">
        <button class="full" id="resetCal">Reset defaults</button>
      </div>
    </details>
    <div class="listhead"><h2>In this frame</h2></div>
    <div id="list"></div>
  </aside>
</main>

<footer id="foot"></footer>

<script src="src/dataset.js"></script>
<script src="src/app.js"></script>
</body>
</html>
